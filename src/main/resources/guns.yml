# ===================== ОГНЕСТРЕЛЬНОЕ ОРУЖИЕ =====================
# Своё оружие MGP. Модели и звуки берутся из ресурспака QualityArmory (сам плагин QualityArmory не нужен).
#
# Управление:
#   ПКМ           — выстрел (держи — очередь, если выбран автоматический режим)
#   F             — сменить режим огня (одиночный / очередь / отсечка), если у оружия их несколько
#   Q             — перезарядка
#   присед (Shift) — прицеливание: меньше разброс и отдача, у снайперских винтовок ещё и приближение
#
# Выдать: /mgp gun give <оружие> [игрок], /mgp gun ammo <патроны> [кол-во] [игрок], /mgp gun list
# В магазинах и наборах: "GUN ak47" и "AMMO 762 60", или { gun: ak47 } / { ammo: "762", amount: 60 }.
# Разрывные стрелы ("EXPLOSIVE_ARROW 4") — снаряды для M79 (ammo: explosive-arrow). Взрыв — settings.explosive-arrows режима.

# Ресурспак с моделями. Отправляется игроку, когда он заходит в лобби одного из режимов modes, и снимается при выходе.
resource-pack:
  enabled: true
  url: "https://github.com/ZombieStriker/QualityArmory-Resourcepack/releases/download/latest/QualityArmory-21.zip"
  hash: ""                       # SHA-1 пака; пусто — плагин скачает пак при запуске и посчитает сам
  required: false                # true — кто отказался от пака, того выкидывает из игры в хаб
  prompt: "<yellow>Модели оружия для режима. <gray>Без пака оружие будет выглядеть как арбалет."
  modes: [assault]

# Общие настройки
settings:
  base-item: STICK               # предмет-основа оружия (модель подменяется паком)
  trigger-hold: 5                # тиков после последнего ПКМ, пока очередь продолжается (клиент шлёт ПКМ раз в 4 тика)
  only-in-games: true            # стрелять можно только в идущей игре (и админам в креативе где угодно)
  tracer: true                   # след пули частицами
  break-glass: false             # пули бьют стекло и панели
  hud: true                      # патроны и режим над хотбаром

# Патроны: model — номер модели в паке QualityArmory (phantom_membrane.json)
ammo:
  "9mm":   { name: "<gray>Патроны 9 мм", model: 1 }
  "556":   { name: "<gray>Патроны 5.56", model: 2 }
  "762":   { name: "<gray>Патроны 7.62", model: 3 }
  shotgun: { name: "<gray>Дробь 12 калибра", model: 4 }
  "50cal": { name: "<gray>Патроны .50", model: 7 }

# Оружие. model — номер модели в паке QualityArmory (crossbow.json): 1 p30, 2 pkp, 3 mp5, 4 ak47, 6 m16, 7 remmington,
# 16 dragunov, 17 spas, 18 aa12, 20 awp, 25 m4a1s, 49 uzi, 55 m79, 59 fnp90, 64 famas, 78 deagle и т.д. (всего 85)
#
#   ammo        — тип патронов из ammo; none — бесконечный запас (только перезарядка магазина);
#                 explosive-arrow — разрывные стрелы (стреляет самой стрелой, взрыв по её типу)
#   magazine    — патронов в магазине          reload  — время перезарядки, сек.
#   reload-mode — magazine (весь магазин) или single (по одному патрону, как дробовик; можно прервать выстрелом)
#   damage      — урон за пулю (у игрока 20 ед. здоровья)   headshot — множитель в голову
#   fire-rate   — выстрелов в минуту             modes — auto | semi | burst (первый — режим по умолчанию)
#   burst       — пуль в отсечке                 pellets — дробин за выстрел
#   spread      — разброс от бедра, градусы      aim-spread — разброс в приседе
#   recoil      — подброс прицела, градусы       range — дальность, блоков
#   knockback   — отбрасывание от пули (0 — нет, 1 — как от удара)
#   zoom        — приближение в приседе (0 — нет, 1-4 — сила)
#   speed       — скорость снаряда (для explosive-arrow)
#   sound / reload-sound — звук из пака (bulletak47, bulletsmall, reloadmagin ...) или ванильный (minecraft:...)
