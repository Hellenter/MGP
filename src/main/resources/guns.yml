# ===================== ОГНЕСТРЕЛЬНОЕ ОРУЖИЕ =====================
# Своё оружие MGP. Модели и звуки берутся из ресурспака QualityArmory (сам плагин QualityArmory не нужен).
#
# Управление:
#   ЛКМ           — выстрел. В автоматическом режиме клик даёт короткую очередь (click-hold), частые клики — сплошной огонь;
#                   если держать ЛКМ, наведясь на блок, очередь идёт непрерывно (ванильный клиент не сообщает, что ЛКМ держат в воздухе)
#   ПКМ или Q     — перезарядка (двери, люки и кнопки ПКМ по-прежнему открываются)
#   F             — сменить режим огня (одиночный / очередь / отсечка), если у оружия их несколько
#   fire-button: right в settings — вернуть старую схему: ПКМ — огонь (держи — очередь), Q — перезарядка
#   присед (Shift) — прицеливание: меньше разброс и отдача, у снайперских винтовок ещё и приближение
#
# Выдать: /mgp gun (меню), /mgp gun give <оружие> [игрок], /mgp gun ammo <патроны> [кол-во] [игрок], /mgp gun list
# Ресурспак вручную (проверить модели вне режима): /mgp pack load [игрок], /mgp pack unload [игрок]
# В магазинах и наборах: "GUN ak47" и "AMMO rifle 60", или { gun: ak47 } / { ammo: rifle, amount: 60 }.
# Разрывные стрелы ("EXPLOSIVE_ARROW 4") — снаряды для M79 (ammo: explosive-arrow). Ракета РПГ-7 — "AMMO rpg 1".
# Взрывы — settings.explosive-arrows режима (у РПГ свой тип rpg: explosive-arrows.types.rpg).
#
# Статы взяты из реальных ТТХ: ёмкость магазина, темп стрельбы, время перезарядки, прицельная дальность.
# Патронов для удобства три вида: пистолетные, промежуточные, винтовочные (плюс картечь и ракеты РПГ).
# Урон считается от энергии пули (у игрока 20 ед. здоровья, броня его снижает): 9 мм ≈ 5, 5.56 ≈ 6, 7.62×39 ≈ 7,
# 7.62×54R ≈ 11, 7.92×57 ≈ 13, .338 Lapua ≈ 19. Попадание в голову ×4 — без брони смертельно почти из всего.
# До effective-range урон полный, дальше линейно падает до min-damage (доля) на range.

# Ресурспак с моделями. Отправляется игроку, когда он заходит в лобби одного из режимов modes, и снимается при выходе.
resource-pack:
  enabled: true
  url: "https://github.com/ZombieStriker/QualityArmory-Resourcepack/releases/download/latest/QualityArmory-21.zip"
  hash: ""                       # SHA-1 пака; пусто — плагин скачает пак при запуске и посчитает сам
  required: false                # true — кто отказался от пака, того выкидывает из игры в хаб
  prompt: "<yellow>Модели оружия для режима. <gray>Без пака оружие будет выглядеть как арбалет."
  modes: [assault]
  # Дополнительные паки поверх пака оружия, в тех же режимах. По умолчанию — военные инструменты MGP и колючая проволока вместо паутины
  # (алмазные кирка, топор и лопата перерисованы: армейская кирка, томагавк, сапёрная лопатка).
  # Пустой список [] — без них.
  extra:
    - "https://raw.githubusercontent.com/Hellenter/MGP/main/packs/assault-tools.zip"

# Общие настройки
settings:
  base-item: STICK               # предмет-основа оружия (модель подменяется паком)
  fire-button: left              # left — огонь на ЛКМ, перезарядка на ПКМ/Q; right — огонь на ПКМ, перезарядка на Q
  click-hold: 6                  # ЛКМ: тиков очереди после одного клика в автоматическом режиме
  trigger-hold: 5                # ПКМ: тиков после последнего сигнала ПКМ, пока очередь продолжается (клиент шлёт ПКМ раз в 4 тика)
  only-in-games: true            # стрелять можно только в идущей игре (и админам в креативе где угодно)
  tracer: true                   # след пули частицами
  tracer-start: 10               # след начинается в стольких блоках от стрелка, чтобы не закрывать обзор
  break-glass: false             # пули бьют стекло и панели
  hud: true                      # патроны и режим над хотбаром

# Патроны: model — номер модели в паке QualityArmory (phantom_membrane.json)
ammo:
  pistol:       { name: "<gray>Пистолетные патроны", model: 1 }      # пистолеты и ПП: P30, Deagle, MP5, Uzi, ППШ-41
  intermediate: { name: "<gray>Промежуточные патроны", model: 2 }    # автоматы: АК-47, M16, M4, FAMAS, АС «Вал»
  rifle:        { name: "<gray>Винтовочные патроны", model: 3 }      # винтовки и пулемёт: СВД, Kar98k, AWP, ПКП
  shotgun:      { name: "<gray>Картечь 12 калибра", model: 4 }
  rpg:          { name: "<red>Выстрел ПГ-7В", model: 5 }

# Оружие. model — номер модели в паке QualityArmory (crossbow.json): 1 p30, 2 pkp, 3 mp5, 4 ak47, 6 m16, 9 rpg,
# 16 dragunov, 17 spas, 18 aa12, 20 awp, 25 m4a1s, 49 uzi, 54 ppsh41, 55 m79, 58 asval, 60 kar98k, 64 famas, 78 deagle и т.д.
#
#   ammo        — тип патронов из ammo; none — бесконечный запас (только перезарядка магазина);
#                 explosive-arrow — разрывные стрелы (стреляет самой стрелой, взрыв по её типу)
#   magazine    — патронов в магазине          reload  — время перезарядки, сек.
#   reload-mode — magazine (весь магазин) или single (по одному патрону; можно прервать выстрелом)
#   damage      — урон за пулю                  headshot — множитель в голову
#   range       — дальность, блоков (1 блок = 1 м)   effective-range — до неё урон полный   min-damage — доля урона на range
#   fire-rate   — выстрелов в минуту             modes — auto | semi | burst (первый — режим по умолчанию)
#   burst       — пуль в отсечке                 pellets — дробин за выстрел
#   spread      — разброс от бедра, градусы      aim-spread — разброс в приседе (кучность оружия)
#   recoil      — подброс прицела, градусы       knockback — отбрасывание (0 — нет, 1 — как от удара)
#   zoom        — приближение в приседе (0 — нет, 1-4 — сила)
#   projectile  — explosive-arrow: летящий взрывной снаряд вместо пули; speed — его скорость,
#                 gravity — падает ли он, explosion — тип взрыва из settings.explosive-arrows.types режима
#   sound / reload-sound — звук из пака (bulletak47, bulletsmall, reloadmagin ...) или ванильный (minecraft:...)
