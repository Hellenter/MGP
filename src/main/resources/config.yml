# Префикс сообщений (MiniMessage: https://docs.advntr.dev/minimessage/format.html)
prefix: "<dark_gray>[<gold>MGP<dark_gray>] <gray>"

# Главное лобби (хаб). Сюда попадают игроки при входе и после игры.
hub:
  world: world
  spawn: "0.5 65 0.5 0 0"     # x y z yaw pitch
  gamemode: ADVENTURE
  protect: true                # без урона/голода, ломать/ставить — только с правом mgp.admin
  sidebar:
    title: "<gold><bold>МИНИИГРЫ"
    lines:
      - "<dark_gray>────────────"
      - "<gray>Игрок: <white>{player}"
      - "<gray>Онлайн: <green>{online}"
      - ""
      - "<gray>Голодные игры: <yellow>{players_hunger_games}"
      - "<gray>Билд баттл: <yellow>{players_build_battle}"
      - "<dark_gray>────────────"
      - "<yellow>ex1.ru"

# Другие серверы сети. Переход — ванильным пакетом transfer (Minecraft 1.20.5+), прокси не нужен.
# На целевом сервере в server.properties должно быть accepts-transfers=true.
# Команды: /server <id>, /smp. Предмет в хотбаре хаба (hotbar-slot 1-8, -1 — без предмета) и пункт в меню игр.
servers:
  smp:
    enabled: true
    name: "<green><bold>Выживание SMP"
    icon: GRASS_BLOCK
    host: ""                   # адрес SMP так, как его вводят в списке серверов (например ex1.ru)
    port: 25566
    hotbar-slot: 4
    description:
      - "<gray>Хардкорное выживание с модом <gold>EAM"
      - "<red>Нужен клиент Fabric 26.3 с модом EAM"

# Параметры типа голосования WEIGHTED (голоса добавляют шанс):
# вес варианта = weight_варианта * base + голоса * per-vote
voting:
  weighted:
    base: 1.0
    per-vote: 1.0

# Пати (как на Hypixel): /p <ник> пригласить, /p accept, /p leave, /pc чат. Игры запускает лидер — вся пати в одну арену.
party:
  max-size: 8              # максимум игроков в пати
  invite-seconds: 60       # сколько действует приглашение
  offline-minutes: 5       # вышедший с сервера остаётся в пати столько минут
  hotbar-slot: 8           # предмет «Пати» в хабе (1-8, -1 — без предмета)

# Статистика игроков (stats.yml): сыграно, победы, убийства, смерти, K/D по режимам. /stats [ник], /stats top <показатель> [режим].
# Голограммы-топы в хабе: /mgp lb add <wins|kills|deaths|played|kd> [режим|all] [строк] (хранятся в leaderboards.yml).
# В строках инфо-панели хаба можно писать {wins} {kills} {games} {kd}.
stats:
  enabled: true
  hotbar-slot: 7           # предмет «Статистика» в хабе (1-8, -1 — без предмета)
  leaderboard-refresh: 30  # раз во сколько секунд обновлять голограммы (и сразу после каждой игры)
  kd-min-games: 5          # в топ по K/D попадают только сыгравшие столько игр
  count-bots: false        # считать ли тестовых ботов (/mgp bot) — для проверки

# Друзья (/f <ник>): дружба хранится в friends.yml, друзья стоят первыми в меню пати.
friends:
  max: 100                 # максимум друзей у игрока
  request-minutes: 5       # сколько действует запрос в друзья
  join-messages: true      # сообщать друзьям о входе и выходе

# Общее лобби ожидания: его получают все режимы, у которых нет своего (waiting.template в файле режима).
# Создать: выдели область /mgp setup pos1 и pos2, встань на точку появления и введи /mgp setup lobby default
default-lobby:
  template: waiting_lobby
  spawn: ""
  void-y: 0
  time: 6000                   # время суток в лобби ожидания (не идёт); -1 — не трогать. time: в режиме важнее

# Миры игр и лобби ожидания
worlds:
  default-gamerules:       # для всех режимов; геймрулы режима и карты (gamerules:) важнее
    random_tick_speed: 0   # не растут посевы, не опадает листва, не тает снег

# Импорт готовых карт из большого мира (/mgp import или админ-панель)
import:
  margin-chunks: 1         # сколько чанков захватить вокруг области (срез карты окажется за барьером)
  optimize-borders: true   # оптимизация границ: обрезать края области, где только воздух (/mgp setup optimize <карта> — для готовых карт)
  optimize-padding: 2      # сколько блоков воздуха оставить вокруг обрезанной карты
  chest-tiers:             # какой тир получают найденные сундуки по типу блока
    CHEST: tier1
    TRAPPED_CHEST: tier2

# Админ-панель (веб-интерфейс в отдельном окне). Ссылка с ключом: /mgp panel
panel:
  enabled: true
  host: 127.0.0.1          # 127.0.0.1 — только с этого компьютера; 0.0.0.0 — доступ по сети (осторожно!)
  port: 8765
  public-url: ""           # если сервер на хостинге: например http://1.2.3.4:8765
  token: ""                # ключ доступа, генерируется автоматически

# Отладка
debug:
  solo: false              # true — игры стартуют с 1 игроком и не заканчиваются, когда игроков или команды не осталось
                           # (время, цели и стадии работают). Переключить в игре: /mgp debug solo on|off
