# ===================== ОСАДА (Siege) =====================
# Две команды. Защитники держат крепость и чинят её молотом, атакующие (больше ресурсов, способности)
# должны убить всех защитников. Руками атакующие ломают только непрочные блоки (breakable-blocks),
# стены крепости — только ТНТ, а его мало. Хоть один защитник жив к концу боя — победа защиты.
# Роли (2 атаки : 6 защиты при 8 игроках) раздаются только при старте, пати — всегда за одну сторону.
# Наборы выбираются после старта, у каждой команды свои, одинаковых — не больше max-same-kit на команду.
# Сначала подготовка (prep-time: команды разделены, драться и взрывать нельзя), потом бой (fight-time).
#
# Карта: крепость — /mgp setup fortress <карта> (из выделения pos1/pos2, можно несколько областей),
#        спавны — /mgp setup teamspawn <карта> defenders | attackers
type: siege
display-name: "<red><bold>Осада"
icon: TNT
description:
  - "<gray>Защити крепость и продержись"
  - "<gray>до конца — или возьми её штурмом!"

min-players: 4
max-players: 8
max-sessions: 2
countdown: 45
fast-countdown: 10
end-delay: 10
time-limit: 0                    # не используется: время задают settings.prep-time и fight-time

map-vote:
  type: MOST_VOTES
  options: 3

natural-mobs: false
gamerules:
  show_advancement_messages: false
  show_death_messages: false
  immediate_respawn: true
  keep_inventory: false

default-kit: ""
# Наборы. Быстрее всего — собрать инвентарь (броню надеть) и ввести /mgp kit save siege <id> <defenders|attackers> [название]:
# сохранятся все слоты, броня и вторая рука, предметы целиком (зачарования, имена). Набор с team заменяет
# defender-items / attacker-items этой команды. Выбор — после старта игры (до старта роли неизвестны):
# если у команды 2+ набора, каждому открывается меню, за kit-select-time сек. не выбрал — дадут наименее занятый.
# Одинаковых наборов в команде — не больше max-same-kit. Наборы без team доступны обеим командам, если у команды нет своих.
# Молот и способности выдаются к любому набору.
kits:
  swordsman:
    display: "<aqua>Мечник"
    icon: IRON_SWORD
    team: defenders
    description: ["<gray>Ближний бой: меч и щит"]
    items:
      - "IRON_SWORD"
      - { material: SHIELD, slot: offhand }
      - { material: IRON_HELMET, slot: head }
      - { material: IRON_LEGGINGS, slot: legs }
      - "COOKED_BEEF 16"
      - "OAK_PLANKS 16"
  archer:
    display: "<aqua>Лучник"
    icon: BOW
    team: defenders
    description: ["<gray>Стрельба со стен"]
    items:
      - "STONE_SWORD"
      - { material: BOW, enchants: { power: 1 } }
      - "ARROW 48"
      - { material: IRON_HELMET, slot: head }
      - "COOKED_BEEF 16"
      - "OAK_PLANKS 16"
  engineer:
    display: "<aqua>Инженер"
    icon: BRUSH
    team: defenders
    description: ["<gray>Много досок и лестниц,", "<gray>заделывает проломы"]
    items:
      - "STONE_SWORD"
      - { material: IRON_HELMET, slot: head }
      - "OAK_PLANKS 64"
      - "OAK_PLANKS 64"
      - "LADDER 16"
      - "COOKED_BEEF 16"
  stormtrooper:
    display: "<red>Штурмовик"
    icon: IRON_AXE
    team: attackers
    description: ["<gray>Крепкая броня и топор"]
    items:
      - "IRON_AXE"
      - { material: IRON_HELMET, slot: head }
      - { material: IRON_LEGGINGS, slot: legs }
      - { material: IRON_BOOTS, slot: feet }
      - "TNT 4"
      - "LADDER 16"
      - "COBBLESTONE 32"
      - "COOKED_BEEF 16"
  sapper:
    display: "<red>Подрывник"
    icon: TNT
    team: attackers
    description: ["<gray>Больше всего ТНТ"]
    items:
      - "STONE_SWORD"
      - { material: IRON_HELMET, slot: head }
      - "TNT 10"
      - "LADDER 16"
      - "COBBLESTONE 32"
      - "COOKED_BEEF 16"
  crossbowman:
    display: "<red>Арбалетчик"
    icon: CROSSBOW
    team: attackers
    description: ["<gray>Стрельба издалека"]
    items:
      - "STONE_SWORD"
      - { material: CROSSBOW, enchants: { quick_charge: 1 } }
      - "ARROW 48"
      - { material: IRON_HELMET, slot: head }
      - "TNT 3"
      - "LADDER 16"
      - "COOKED_BEEF 16"
start-items: []

win-actions:
  - "message: <gold>Победа в осаде!"

# Плейсхолдеры режима: {team} {defenders} {attackers} {integrity} {respawn} {phase} (До боя / До конца), {time} — сколько осталось фазы
sidebar:
  title: "<red><bold>ОСАДА"
  waiting:
    - "<dark_gray>────────────"
    - "<gray>Карта: {map}"
    - "<gray>Игроки: <green>{players}/{max}"
    - "<gray>Статус: <yellow>{state}"
    - "<dark_gray>────────────"
  playing:
    - "<dark_gray>────────────"
    - "<gray>Ты: {team}"
    - "<gray>{phase}: <yellow>{time}"
    - ""
    - "<blue>Защитники: <white>{defenders}"
    - "<red>Атакующие: <white>{attackers}"
    - "<gray>Крепость: <white>{integrity}"
    - ""
    - "<gray>Карта: {map}"
    - "<dark_gray>────────────"
  ending:
    - "<dark_gray>────────────"
    - "<gold>Игра окончена!"
    - "<dark_gray>────────────"

settings:
  # Разрывные стрелы ("EXPLOSIVE_ARROW 16" в наборах, /mgp arrow). Все параметры — в README, раздел «Разрывные стрелы».
  explosive-arrows:
    enabled: false
    power: 2.0
    break-blocks: true
    self-damage: 0.5
    team-damage: 0.0
  empty-chests: true             # лута в осаде нет: сундуки, бочки и шалкеры карты пустые (false — оставить как на карте)
  defender-ratio: 0.75           # доля защитников: при 8 игроках 6 защиты и 2 атаки (пати остаются в одной команде)
  prep-time: "30:00"             # подготовка: граница между зонами команд закрыта (/mgp setup teamzone), PvP и ТНТ нет
  fight-time: "15:00"            # бой: хоть один защитник жив к концу — победа защиты
  defender-glow: "3:00"          # за сколько до конца боя защитники начинают светиться (0 — никогда)
  hide-enemy-nametags: true      # ники: атака красная, защита синяя; свои видны всегда
  enemy-nametag-on-aim: true     # ник противника виден, только пока смотришь прямо на него (сквозь стены — нет)
  nametag-aim-distance: 64       # дальность наведения, блоков
  max-same-kit: 2                # одинаковых наборов в одной команде (0 — без ограничения)
  kit-select-time: 60            # сек. на выбор набора после старта, потом выдаётся наименее занятый
  attacker-respawn: 5            # через сколько сек. возрождается атакующий (-1 — не возрождается)
  attacker-keep-inventory: true  # атакующий не теряет вещи при смерти (новый ТНТ не выдаётся!)
  tnt-auto-ignite: true          # ТНТ поджигается сразу при установке
  tnt-fuse: 3                    # сек. до взрыва
  # Что можно ломать руками (обеим командам). Остальное — только ТНТ. Поставленные за игру блоки ломаются всегда.
  # Можно: имя блока, маску (*_PLANKS) или тег (#minecraft:logs)
  breakable-blocks:
    - "#minecraft:dirt"
    - GRASS_BLOCK
    - DIRT_PATH
    - FARMLAND
    - SAND
    - RED_SAND
    - GRAVEL
    - "*_PLANKS"
    - "*_WOOL"
    - "*_CARPET"
    - "#minecraft:leaves"
    - LADDER
    - SCAFFOLDING
    - HAY_BLOCK
    - "*_FENCE"
    - "*_FENCE_GATE"
    - SHORT_GRASS
    - TALL_GRASS
  explosion-proof: [BEDROCK, BARRIER, OBSIDIAN]   # ТНТ не берёт

  repair:                        # молот защитников: ПКМ по стене возвращает исходные блоки крепости
    item: BRUSH
    radius: 3
    blocks-per-use: 3
    cooldown: 1.0

  defender-items:
    - "STONE_SWORD"
    - "BOW"
    - "ARROW 24"
    - "COOKED_BEEF 16"
    - "OAK_PLANKS 32"
    - { material: IRON_HELMET, slot: head }
  attacker-items:
    - "IRON_SWORD"
    - "CROSSBOW"
    - "ARROW 32"
    - "TNT 6"
    - "COOKED_BEEF 16"
    - "LADDER 16"
    - "COBBLESTONE 32"
    - { material: IRON_HELMET, slot: head }
    - { material: IRON_BOOTS, slot: feet }

  # Способности: ПКМ предметом. Действия — как у триггеров (velocity, effect, nearby-effect, sound, particle...).
  abilities:
    - id: leap
      team: attackers
      item: FEATHER
      name: "<aqua><bold>Рывок"
      lore: ["<gray>Прыжок вперёд"]
      cooldown: 12
      actions:
        - "velocity: 1.6 0.6"
        - "sound: minecraft:entity.breeze.jump"
    - id: rage
      team: attackers
      item: BLAZE_POWDER
      name: "<red><bold>Ярость"
      lore: ["<gray>Сила и скорость на 8 сек."]
      cooldown: 45
      actions:
        - "effect: strength 0 8"
        - "effect: speed 1 8"
        - "sound: minecraft:entity.ravager.roar"
    - id: smoke
      team: attackers
      item: GUNPOWDER
      name: "<gray><bold>Дымовая шашка"
      lore: ["<gray>Ослепляет защитников рядом (5 бл.)"]
      cooldown: 40
      actions:
        - "particle: CAMPFIRE_SIGNAL_SMOKE 40"
        - "nearby-effect: 5 blindness 0 4"
        - "sound: minecraft:block.fire.extinguish"
