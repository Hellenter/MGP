          13: "ENCHANTED_GOLDEN_APPLE 1"
          "11,15": { item: { material: GOLDEN_APPLE, name: "<red>Аптечка" }, amount: 2 }

# Плейсхолдеры: {team} {stage} (1/3) {stage_name} {phase} {time} {money} {objectives} (1/2)
#               {objectives_progress} (проценты целей стадии) {attackers} {defenders} {limbo}
sidebar:
  title: "<gold><bold>ШТУРМ"
  waiting:
    - "<dark_gray>────────────"
    - "<gray>Карта: {map}"
    - "<gray>Игроки: <green>{players}/{max}"
    - "<gray>Статус: <yellow>{state}"
    - "<dark_gray>────────────"
  playing:
    - "<dark_gray>────────────"
    - "<gray>Ты: {team}"
    - "<gray>Счёт: <gold>{money} ⛁"
    - ""
    - "<gray>Стадия: <yellow>{stage}"
    - "{stage_name}"
    - "<gray>{phase}: <yellow>{time}"
    - "<gray>Цели: <white>{objectives_progress}"
    - ""
    - "<red>Атака: <white>{attackers} <dark_gray>| <blue>Защита: <white>{defenders}"
    - "<gray>Карта: {map}"
    - "<dark_gray>────────────"
  ending:
    - "<dark_gray>────────────"
    - "<gold>Игра окончена!"
    - "<dark_gray>────────────"

settings:
  # Разрывные стрелы ("EXPLOSIVE_ARROW 8" в магазине атаки) — ещё и снаряды гранатомёта M79 (guns.yml). Все параметры — в README, раздел «Разрывные стрелы».
  explosive-arrows:
    enabled: true
    power: 2.0
    break-blocks: true
    self-damage: 0.5
    team-damage: 0.0
    types:
      rpg:                       # ракета РПГ-7 (guns.yml → rpg, explosion: rpg)
        power: 3.5
        self-damage: 0.5
  chest-loot: true               # военные ящики (loot выше): контейнеры с предметом-маркером
  auto-chests: false             # без маркера контейнер не заполняется (никакого «по типу блока»)
  empty-unmarked: true           # остальные сундуки, бочки и шалкеры карты пустые
  defender-ratio: 0.5            # доля защитников (пати остаются в одной команде)
  prep-time: "1:00"              # подготовка перед первой стадией: закупка, зоны команд закрыты, PvP и взрывов нет
  stage-time: "15:00"            # время стадии, если у стадии в карте не задано своё time
  respawn-delay: 5               # сек. в лимбо после смерти, прежде чем можно выйти
  limbo-timeout: 0               # через сколько сек. в лимбо выкинуть в бой автоматически (0 — не выкидывать)
  spawn-protection: 3            # сек. неуязвимости после выхода из лимбо (снимается, если сам атакуешь)
  keep-inventory: false          # false — после смерти покупки теряются, бесплатный набор выдаётся заново
  drop-items: false              # выпадают ли вещи убитого (false — нет: нельзя «фармить» чужие покупки)
  stage-zones: cumulative        # зоны стадий (stage <n> zone): cumulative — в стадии N открыты зоны 1..N; replace — только последняя заданная
  redeploy-on-stage: none        # при смене стадии перенести на новые спавны: none | defenders | attackers | all
  hide-enemy-nametags: true      # ники: атака красная, защита синяя; свои видны всегда
  enemy-nametag-on-aim: true     # ник противника виден, только пока смотришь прямо на него (сквозь стены — нет)
  nametag-aim-distance: 64       # дальность наведения, блоков
  tnt-auto-ignite: true          # ТНТ поджигается сразу при установке
  tnt-fuse: 3                    # сек. до взрыва
  defender-tnt: false            # могут ли защитники ставить ТНТ
  objective-hand-break: false    # true — атакующие могут ломать блоки целей руками (иначе только взрывы)
  defenders-repair: false        # true — защитники могут заделывать цели блоками
  # Магазин лимбо (изумруд в хотбаре): один на всех (shop: assault) или свой у каждой команды
  shop:
    attackers: assault_attackers
    defenders: assault_defenders
  economy:
    start: 800                   # монет у каждого в начале
    max: 16000                   # максимум на счёте (0 — без лимита)
    kill: 100                    # за убийство противника
    defense-kill: 75             # защитнику сверху, если убитый или он сам ближе defense-radius к цели стадии
    defense-radius: 16
    objective: 400               # каждому атакующему, кто ломал разрушенную цель (взрывом или руками)
    objective-team: 200          # всей атаке за каждую разрушенную цель
    stage-attackers: 300         # атаке за взятую стадию
    stage-defenders: 300         # защите после потери стадии (на перегруппировку)
    income: 50                   # всем раз в income-every сек. (0 — без дохода)
    income-every: 60
  # Что можно ломать руками (обеим командам). Блоки, поставленные за игру, ломаются всегда.
  breakable-blocks:
    - "*_PLANKS"
    - "*_WOOL"
    - LADDER
    - SCAFFOLDING
    - "*_FENCE"
    - "*_FENCE_GATE"
    - SHORT_GRASS
    - TALL_GRASS
    - "#minecraft:leaves"
  explosion-proof: [BEDROCK, BARRIER, OBSIDIAN]   # взрывы не берут
  # Бесплатное снаряжение при каждом выходе (если у команды нет набора с team в kits)
  # Огнестрел и патроны — "GUN p30", "AMMO pistol 30" (guns.yml); ресурспак с моделями отправляется при входе в режим.
  defender-items:
    - "STONE_SWORD"
    - "GUN p30"
    - "AMMO pistol 30"
    - "BOW"
    - "ARROW 16"
  attacker-items:
    - "STONE_SWORD"
    - "GUN p30"
    - "AMMO pistol 30"
    - "CROSSBOW"
    - "ARROW 16"
    - "TNT 1"
