# ===================== ШТУРМ (Assault) =====================
# Большая осада по стадиям. Две команды: атакующие разрушают цели на стороне защитников, защитники мешают.
# На каждую стадию своё время (по умолчанию stage-time). Разрушили цели стадии — следующая стадия,
# спавны обеих команд переезжают дальше. Не успели — победа защиты. Взяли последнюю стадию — победа атаки.
#
# Экономика: монеты за убийства, разрушенные цели, оборону (убийство рядом с целью) и взятую стадию.
# Тратятся в магазине лимбо: после смерти игрок попадает в лимбо своей команды, покупает оружие, броню
# или целый набор и выходит через проход (триггер с действием mode: deploy) на текущий спавн команды.
#
# Карта (подробно — README, раздел «Штурм»):
#   цели          — /mgp setup objective <карта> <id> [процент] [название]   (из выделения pos1/pos2)
#   стадии        — /mgp setup assault <карта> stage <n> [время] [название]; stage <n> objective <id>
#   спавны стадий — /mgp setup assault <карта> stage <n> spawn <attackers|defenders>   (там, где стоишь)
#   лимбо         — /mgp setup assault <карта> limbo <attackers|defenders>; выход — /mgp setup assault <карта> exit
type: assault
display-name: "<gold><bold>Штурм"
icon: CROSSBOW
description:
  - "<gray>Атакуй цели по стадиям или удержи их."
  - "<gray>Зарабатывай монеты и покупай снаряжение."

min-players: 4
max-players: 24
max-sessions: 1
countdown: 60
fast-countdown: 10
end-delay: 10
time-limit: 0                    # не используется: время задают стадии (stage-time или time стадии в карте)

map-vote:
  type: MOST_VOTES
  options: 3

natural-mobs: false
gamerules:
  show_advancement_messages: false
  show_death_messages: false
  immediate_respawn: true
  keep_inventory: false

default-kit: ""
# Наборы с team выдаются бесплатно при каждом выходе из лимбо (первый набор команды) вместо defender-items / attacker-items.
# Платные наборы — в магазинах (shops/assault_*.yml): товар с items: [...] и price: "MONEY n".
kits: {}
start-items:
  - "COOKED_BEEF 8"

win-actions:
  - "message: <gold>Победа в штурме!"

# ===================== ВОЕННЫЕ ЯЩИКИ =====================
# Тип ящика задаёт предмет-маркер: строитель кладёт в сундук/бочку/шалкер ОДИН вид предметов из списка ниже
# (например, железный слиток) — при старте игры содержимое заменяется одной из раскладок этого типа.
# Раскладка выбирается случайно по weight, но предметы всегда лежат в своих слотах (как в настоящем «цинке»).
# Остальные контейнеры карты пустые (settings.empty-unmarked). Двойной сундук — это два ящика: маркер в каждой половине.
#
# Слоты сундука/бочки: 0-8 верхний ряд, 9-17 средний, 18-26 нижний (центр — 13).
# Слот: номер (13), диапазон ("10-16") или список ("10,12,14,16"). Предмет — как в магазинах:
#   "GUN m16", "AMMO rifle 64", "TNT 8", "EXPLOSIVE_ARROW 8", { item: "AMMO rifle", amount: 32-64 }, { item: {material: ..., name: ...} }
# Оружие и патроны — guns.yml. title — заголовок окна ящика.
loot-markers:
  IRON_INGOT: weapons_t1             # оружие, тир 1 — пистолеты и ПП
  GOLD_INGOT: weapons_t2             # оружие, тир 2 — автоматы и дробовик
  DIAMOND: weapons_special           # спецоружие — пулемёт, снайперки, гранатомёты
  COPPER_INGOT: ammo                 # патроны
  GUNPOWDER: explosives              # взрывчатка
  BRICK: building                    # застройка
  GLISTERING_MELON_SLICE: medical    # медикаменты
loot:
  weapons_t1:
    title: "<dark_green>Оружейный ящик · T1"
    presets:
      - { name: "3 × P30", weight: 4, slots: { "11,13,15": "GUN p30" } }
      - { name: "2 × Desert Eagle", weight: 2, slots: { "12,14": "GUN deagle" } }
      - { name: "3 × MP5", weight: 3, slots: { "11,13,15": "GUN mp5" } }
      - { name: "3 × Uzi", weight: 3, slots: { "11,13,15": "GUN uzi" } }
      - { name: "2 × ППШ-41", weight: 2, slots: { "12,14": "GUN ppsh41" } }
      - name: "P30 + MP5 с патронами"
        weight: 2
        slots:
          11: "GUN p30"
          13: "GUN mp5"
          "15-16": "AMMO pistol 32"
  weapons_t2:
    title: "<dark_green>Оружейный ящик · T2"
    presets:
      - { name: "3 × M16", weight: 3, slots: { "11,13,15": "GUN m16" } }
      - { name: "3 × АК-47", weight: 3, slots: { "11,13,15": "GUN ak47" } }
      - { name: "2 × M4A1", weight: 2, slots: { "12,14": "GUN m4a1s" } }
      - { name: "2 × FAMAS", weight: 2, slots: { "12,14": "GUN famas" } }
      - { name: "2 × АС «Вал»", weight: 1, slots: { "12,14": "GUN asval" } }
      - { name: "2 × SPAS-12", weight: 2, slots: { "12,14": "GUN spas" } }
  weapons_special:
    title: "<dark_red>Ящик спецвооружения"
    presets:
      - { name: "ПКП", weight: 2, slots: { 13: "GUN pkp" } }
      - { name: "СВД", weight: 2, slots: { 13: "GUN dragunov" } }
      - { name: "AWP", weight: 1, slots: { 13: "GUN awp" } }
      - { name: "2 × Kar98k", weight: 2, slots: { "12,14": "GUN kar98k" } }
      - { name: "AA-12", weight: 1, slots: { 13: "GUN aa12" } }
      - name: "M79 + 8 гранат"
        weight: 1
        slots:
          12: "GUN m79"
          14: "EXPLOSIVE_ARROW 8"
      - name: "РПГ-7 + 2 выстрела"
        weight: 1
        slots:
          12: "GUN rpg"
          14: "AMMO rpg 2"
  ammo:
    title: "<gold>Цинк с патронами"
    presets:
      - { name: "4 × винтовочные", weight: 2, slots: { "10,12,14,16": "AMMO rifle 64" } }
      - { name: "4 × промежуточные", weight: 3, slots: { "10,12,14,16": "AMMO intermediate 64" } }
      - { name: "4 × пистолетные", weight: 3, slots: { "10,12,14,16": "AMMO pistol 64" } }
      - { name: "3 × картечь", weight: 2, slots: { "11,13,15": "AMMO shotgun 32" } }
      - name: "Сборный"
        weight: 2
        slots:
          10: "AMMO pistol 64"
          12: "AMMO intermediate 64"
          14: "AMMO rifle 32"
          16: "AMMO shotgun 16"
  explosives:
    title: "<red>Ящик взрывчатки"
    presets:
      - { name: "ТНТ", weight: 3, slots: { "11,13,15": "TNT 8" } }
