# ===================== ПРЯТКИ (классика) =====================
# Прячущиеся прячутся сами, ищущие ищут. Пойманный становится ищущим.
# Ищущие поймали всех — победа ищущих; дожили до конца времени — победа прячущихся.
type: hide_and_seek
display-name: "<green><bold>Прятки"
icon: SPYGLASS
description:
  - "<gray>Спрячься получше и продержись"
  - "<gray>до конца — или найди всех!"

min-players: 3
max-players: 12
max-sessions: 4
countdown: 45
fast-countdown: 10
end-delay: 10
time-limit: "5:00"

# waiting: не задан — используется общее лобби ожидания (default-lobby в config.yml)

map-vote:
  type: MOST_VOTES
  options: 3

natural-mobs: false
gamerules:
  show_advancement_messages: false
  show_death_messages: false
  immediate_respawn: true

default-kit: ""
kits: {}
start-items: []

win-actions:
  - "message: <gold>Победа в прятках!"

# Плейсхолдеры режима: {role} {hiders} {seekers} {points} {hide_left} {disguise}
sidebar:
  title: "<green><bold>ПРЯТКИ"
  waiting:
    - "<dark_gray>────────────"
    - "<gray>Карта: {map}"
    - "<gray>Игроки: <green>{players}/{max}"
    - "<gray>Статус: <yellow>{state}"
    - "<dark_gray>────────────"
  playing:
    - "<dark_gray>────────────"
    - "<gray>Ты: {role}"
    - "<gray>Ищущие выходят: <yellow>{hide_left}"
    - "<gray>До конца: <yellow>{time}"
    - ""
    - "<gray>Прячущихся: <green>{hiders}"
    - "<gray>Ищущих: <red>{seekers}"
    - "<gray>Очки за таунты: <light_purple>{points}"
    - ""
    - "<gray>Карта: {map}"
    - "<dark_gray>────────────"
  ending:
    - "<dark_gray>────────────"
    - "<gold>Игра окончена!"
    - "<gray>Очки за таунты: <light_purple>{points}"
    - "<dark_gray>────────────"

settings:
  variant: classic                 # classic | prophunt
  hide-time: 45                    # сек., пока ищущие ослеплены и стоят
  seekers: 1                       # сколько ищущих минимум
  seeker-ratio: 0.2                # или доля от игроков (берётся большее)
  caught: seeker                   # seeker — пойманный ищет вместе со всеми | spectator — выбывает
  seeker-damage: 9                 # урон ножа за полный удар, HP (9 = 4.5 сердца); критов нет; 0 — считать по hits-to-kill
  hits-to-kill: 3                  # при seeker-damage: 0 — нож ловит с N полных ударов (1 — с одного; 0 — по урону оружия)
  seeker-weapon: IRON_SWORD
  seeker-weapon-name: "<red><bold>Нож"
  seeker-speed: 5                  # ищущий быстрее прячущихся на N процентов (0 — как все)
  provocation-items: true          # каждая провокация — отдельный предмет в хотбаре (false — одно меню через рог)
  taunt-heal: 2                    # таунт восстанавливает прячущемуся N HP (2 = 1 сердце)
  taunt-cooldown: 40               # таунтовать можно не чаще раза в N сек. (общая перезарядка всех таунтов)
  auto-taunt: 60                   # раз в N сек. все прячущиеся сами издают случайный звук (0 — выкл.)
  hide-nametags: true              # ники над головами не видно никому (ни через стены, ни вблизи)
  disable-hunger: true             # голод не тратится
  no-regen: true                   # здоровье само не восстанавливается
  # Ищущий не получает урона ни от чего (падение, огонь, удары); в пустоте — обратно на спавн ищущих
  # (необязательно) seeker-spawn в файле карты — комната, где ищущие ждут hide-time

  # Таунты прячущихся: звук/частицы из места, где ты прячешься. Дают очки (рискуешь — получаешь).
  # sound — id звука ванилы, particle — имя частиц (NOTE, HEART, ANGRY_VILLAGER...), type: sound | firework
  taunts:
    - { id: meow,    display: "<yellow>Мяу",            icon: STRING,       sound: "minecraft:entity.cat.ambient",            particle: HEART,          cooldown: 10, points: 1 }
    - { id: villager, display: "<yellow>Хмм...",        icon: EMERALD,      sound: "minecraft:entity.villager.no",            particle: ANGRY_VILLAGER, cooldown: 15, points: 2 }
    - { id: burp,    display: "<yellow>Отрыжка",        icon: COOKED_BEEF,  sound: "minecraft:entity.player.burp",            particle: CLOUD,          cooldown: 15, points: 2 }
    - { id: goat,    display: "<gold>Крик козы",        icon: GOAT_HORN,    sound: "minecraft:entity.goat.screaming.ambient", particle: NOTE,           cooldown: 25, points: 4, volume: 3 }
    - { id: firework, display: "<red><bold>Салют",      icon: FIREWORK_ROCKET, sound: "minecraft:entity.firework_rocket.launch", type: firework,    cooldown: 45, points: 8,
        lore: ["<gray>Видно на всю карту"] }

  # Провокации ищущих (у каждой свой предмет). type: sound (звук из места прячущегося)
  #   | glow (подсветка сквозь стены на duration сек.) | particles (частицы duration сек.) | firework (салют)
  # target: all — все прячущиеся | nearest — только ближайший к ищущему
  # max-hiders: N — доступна, когда прячущихся N или меньше; max-time-left: N — когда до конца N сек. или меньше
  provocations:
    - { id: provoke, display: "<yellow>Провокация", icon: BELL, sound: "minecraft:entity.chicken.ambient", volume: 2.5, particle: NOTE,
        type: sound, target: nearest, cooldown: 90,
        lore: ["<gray>Ближайший прячущийся издаёт звук"] }
    - { id: glow, display: "<aqua><bold>Подсветка", icon: GLOWSTONE_DUST, type: glow, duration: 6, cooldown: 120,
        max-hiders: 2, max-time-left: 360,
        lore: ["<gray>Прячущиеся светятся сквозь стены 6 сек."] }
