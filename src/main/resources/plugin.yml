name: MGP
version: '${version}'
main: ru.mgp.MGPPlugin
api-version: '26.1'
description: Миниигры в стиле Hypixel
commands:
  mgp:
    description: Главная команда миниигр
    usage: /mgp help
  leave:
    description: Выйти из игры в главное лобби
    aliases: [hub, l]
  play:
    description: Открыть меню игр
  server:
    description: Перейти на другой сервер сети
    usage: /server [id]
  party:
    description: Пати с друзьями (/p <ник> — пригласить)
    usage: /party help
    aliases: [p]
  friend:
    description: Друзья (/f <ник> — добавить)
    usage: /friend help
    aliases: [f, friends]
  pc:
    description: Чат пати
    usage: /pc <сообщение>
  smp:
    description: Перейти на сервер выживания SMP (нужен мод EAM)
permissions:
  mgp.admin:
    description: Настройка карт, принудительный старт, перезагрузка
    default: op
  mgp.afk.bypass:
    description: Не выкидывать из игры за бездействие
    default: false
  mgp.anticheat.bypass:
    description: Не проверять античитом
    default: false
